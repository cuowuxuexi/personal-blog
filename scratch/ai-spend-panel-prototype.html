<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>原型 · AI 开支记录与优化</title>
  <style>
    /**
     * 低保真草图 — 与博客 / 发布面板同源的设计 token
     * 色板与字体：docs/.vitepress/theme/style.css、panel/DESIGN.md
     * 橙 #e66700 只表示可交互；印章红 #b23a2e 只给「确认发布」
     */
    :root {
      color-scheme: light;
      --ink: #1c2127;
      --ink-2: #6e7681;
      --accent: #e66700;
      --paper: #f7f5f1;
      --card: #ffffff;
      --invest: #2949a4;
      --life: #0d7a5f;
      --seal: #b23a2e;
      --line: rgba(28, 33, 39, 0.16);
      --line-soft: rgba(28, 33, 39, 0.08);
      --divider: #e2e2e3;       /* 博客正文分隔线 */
      --text-2: #67676c;        /* vp-c-text-2 */
      --bg-soft: #f6f6f7;       /* vp-c-bg-soft，侧栏底 */
      --accent-ring: rgba(230, 103, 0, 0.15);
      --accent-wash: rgba(230, 103, 0, 0.05);
      --serif: "Source Han Serif CN", "Source Han Serif SC", "Noto Serif SC",
        "Songti SC", "STSong", "PingFang SC", "Microsoft YaHei", serif;
      --mono: "Fira Code", "Cascadia Code", Consolas,
        "PingFang SC", "Microsoft YaHei", monospace;
      --r-xs: 2px;
      --r-sm: 4px;
      --r-pill: 999px;
      --shadow-paper: 0 1px 2px rgba(28, 33, 39, 0.05);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.8;
    }
    /* 稿纸底纹：28px 点阵 + 居中竖格线，向下渐隐（同博客首页与面板） */
    body::before {
      content: "";
      position: fixed;
      z-index: 0;
      top: 0;
      left: 50%;
      width: min(1200px, calc(100% - 32px));
      height: 620px;
      pointer-events: none;
      transform: translateX(-50%);
      opacity: 0.5;
      background-image:
        linear-gradient(90deg, transparent 49.9%, var(--line-soft) 50%, transparent 50.1%),
        radial-gradient(circle, var(--line-soft) 1px, transparent 1.2px);
      background-size: 100% 100%, 28px 28px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
      -webkit-mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    ::selection { background: var(--ink); color: var(--paper); }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 30px 24px 72px;
    }

    /* ---------- 刊头 ---------- */
    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }
    .eyebrow {
      margin: 0 0 6px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .top h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.05em;
    }
    .status {
      margin: 0 0 2px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.03em;
      color: var(--ink-2);
      text-align: right;
    }

    /* ---------- 胶囊：视图 / 方案 / 栏目 ---------- */
    .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    .chips-label {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .chip {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink-2);
      border-radius: var(--r-pill);
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      line-height: 1.5;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }
    .chip:hover { border-color: var(--accent); color: var(--ink); }
    /* 模式类 chip 激活：墨底纸字 */
    .chip.active { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    /* 栏目 chip 激活：栏目色（journey 属 AI与生活，用 life 绿） */
    .kinds { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .kinds .chip[data-kind="invest"].active {
      background: color-mix(in srgb, var(--invest) 10%, var(--card));
      border-color: color-mix(in srgb, var(--invest) 45%, transparent);
      color: var(--invest);
    }
    .kinds .chip[data-kind="life"].active,
    .kinds .chip[data-kind="journey"].active {
      background: color-mix(in srgb, var(--life) 10%, var(--card));
      border-color: color-mix(in srgb, var(--life) 45%, transparent);
      color: var(--life);
    }
    .variant-desc {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.03em;
      color: var(--ink-2);
    }
    .view[hidden] { display: none; }

    /* ---------- 面板：篇章刊头卡 ---------- */
    .issue-bar {
      background: linear-gradient(125deg, var(--accent-wash), transparent 60%), var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      padding: 18px 20px 16px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-paper);
    }
    .issue-bar h2 {
      margin: 0 0 4px;
      font-size: 20px;
      font-weight: 650;
      line-height: 1.4;
      letter-spacing: 0.02em;
    }
    .issue-meta {
      margin: 0 0 10px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-2);
    }
    .write-hint {
      margin: 0 0 14px;
      padding-left: 10px;
      border-left: 2px solid var(--accent);
      font-size: 13px;
      line-height: 1.7;
      color: var(--ink-2);
    }
    .issue-select {
      width: auto;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: var(--r-xs);
      background: var(--card);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink);
    }

    /* ---------- 面板：双栏 ---------- */
    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 20px; align-items: start; }
    .entries, .editor {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-paper);
    }
    .entries { padding: 16px; }
    .editor { padding: 24px; }
    .entries h3 {
      margin: 0 0 6px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .entry-row { position: relative; border-bottom: 1px solid var(--line-soft); }
    .entry-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 9px 42px 9px 2px;
      font-size: 13.5px;
      font-weight: 500;
      line-height: 1.55;
      color: var(--ink);
    }
    .entry-btn:hover { color: var(--accent); }
    .entry-btn.active { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 8px; }
    .entry-btn small {
      display: block;
      margin-top: 1px;
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0.03em;
      color: var(--ink-2);
    }
    .entry-delete {
      position: absolute;
      top: 9px;
      right: 0;
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: var(--ink-2);
      font-family: var(--mono);
      font-size: 10px;
    }
    .entry-delete:hover { color: var(--seal); }
    .entries .ghost { width: 100%; margin-top: 12px; }

    /* ---------- 面板：表单 ---------- */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field span {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .field.grow { flex: 1; }
    .row { display: flex; gap: 14px; }
    input, textarea, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-xs);
      padding: 9px 12px;
      font-family: var(--serif);
      font-size: 15px;
      color: var(--ink);
    }
    input::placeholder, textarea::placeholder { color: #a3a9b0; }
    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }
    textarea { resize: vertical; line-height: 1.8; }
    .media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .drop {
      border: 1px dashed var(--line);
      border-radius: var(--r-sm);
      padding: 14px;
      min-height: 72px;
      background: var(--paper);
    }
    .drop strong { display: block; margin-bottom: 2px; font-size: 14px; font-weight: 650; }
    .drop p { margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink-2); }
    .more { margin: 4px 0 18px; }
    .more summary {
      list-style: none;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--ink-2);
    }
    .more summary::-webkit-details-marker { display: none; }
    .more summary::before { content: "▸"; display: inline-block; margin-right: 6px; font-size: 10px; }
    .more[open] summary::before { content: "▾"; }
    .more[open] summary { margin-bottom: 14px; }

    /* ---------- 面板：按钮与动作行 ---------- */
    .primary, .danger, .ghost {
      border: 1px solid transparent;
      border-radius: var(--r-xs);
      padding: 9px 20px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }
    .primary { background: var(--ink); color: var(--paper); }
    .primary:hover { background: #313943; }
    .danger { background: var(--seal); color: #fff; }
    .ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
    .ghost:hover { border-color: var(--accent); color: var(--accent); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line-soft);
    }

    /* ---------- 面板：发布任务卡 ---------- */
    .publish-job {
      margin-top: 18px;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      background: var(--card);
    }
    .job-state, .job-preview-label, .wechat-status {
      margin: 0 0 8px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .job-preview-label, .wechat-status { color: var(--ink-2); }
    .wechat-status.is-ready { color: var(--life); }
    .job-manifest {
      margin: 0 0 10px;
      padding-left: 1.2em;
      font-family: var(--mono);
      font-size: 12px;
    }
    .notice {
      margin: 12px 0 0;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      color: var(--ink-2);
    }

    /* ---------- 面板：台账表（方案 B，墨线表格） ---------- */
    .ledger { width: 100%; border-collapse: collapse; background: var(--card); }
    .ledger th, .ledger td {
      border-bottom: 1px solid var(--line-soft);
      padding: 10px 8px;
      text-align: left;
      font-size: 13.5px;
      font-weight: 400;
    }
    .ledger th {
      font-family: var(--mono);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--ink-2);
      border-bottom: 1px solid var(--line);
    }
    .ledger input, .ledger select { padding: 6px 8px; font-size: 13.5px; }
    .money { font-variant-numeric: tabular-nums; }

    /* ---------- 面板：时间线（方案 C，细墨线 + mono 日期） ---------- */
    .timeline { position: relative; padding-left: 18px; }
    .timeline::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: var(--line);
    }
    .event { position: relative; padding: 0 0 18px; }
    .event::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 9px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--ink);
    }
    .event time {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-2);
    }
    .event h4 { margin: 2px 0 4px; font-size: 14px; font-weight: 650; }
    .event p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--ink-2); }

    /* ---------- 博客页：weekly-post 阅读版式 ---------- */
    .blog-layout {
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      gap: 32px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-sm);
      box-shadow: var(--shadow-paper);
      overflow: hidden;
    }
    .blog-sidebar {
      background: var(--bg-soft);
      border-right: 1px solid var(--divider);
      padding: 24px 16px;
    }
    .side-title { margin: 0 0 10px; font-size: 0.9rem; font-weight: 600; }
    .side-group {
      margin: 18px 0 6px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.08em;
      color: var(--ink-2);
    }
    .blog-sidebar a {
      display: block;
      padding: 5px 8px;
      border-radius: var(--r-xs);
      color: var(--ink);
      text-decoration: none;
      font-size: 0.82rem;
      line-height: 1.7;
    }
    .blog-sidebar a:hover { color: var(--accent); }
    .blog-sidebar a.active { color: var(--life); font-weight: 600; }

    .weekly {
      max-width: 688px;
      padding: 32px 32px 40px 8px;
      font-size: 16px;
      line-height: 1.75;
    }
    .post-meta {
      margin: 0 0 6px;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      color: var(--text-2);
    }
    .weekly h1 {
      margin: 0 0 16px;
      font-size: 40px;
      font-weight: 600;
      line-height: 48px;
      letter-spacing: -0.02em;
    }
    .theme-cover {
      margin: 0 0 12px;
      border: 1px dashed var(--line);
      border-radius: var(--r-xs);
      background: var(--paper);
      padding: 34px 16px;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--ink-2);
    }
    .theme-caption { margin: 0 0 8px; color: var(--text-2); font-size: 15px; line-height: 26px; }
    .weekly p { margin: 16px 0; line-height: 28px; }
    .weekly a { color: var(--accent); font-weight: 500; text-decoration: none; }
    .weekly blockquote {
      margin: 16px 0;
      padding: 0 0 0 16px;
      border-left: 2px solid var(--divider);
      color: var(--text-2);
    }
    .weekly blockquote p { margin: 0; }

    /* 条目：与 WeeklyEntry 一致 —— 绿色胶囊标签 + 橙色宋体大标题 + 灰副标题 */
    .entry {
      margin: 40px 0 0;
      padding: 0 0 32px;
      border-bottom: 1px solid var(--divider);
    }
    .entry:first-of-type { margin-top: 28px; }
    .entry:last-of-type { border-bottom: 0; padding-bottom: 0; }
    .entry-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
    .entry-tags span {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border: 1px solid color-mix(in srgb, var(--life) 35%, var(--divider));
      border-radius: var(--r-pill);
      color: var(--life);
      font-size: 12px;
      font-weight: 500;
      line-height: 18px;
      letter-spacing: 0.02em;
    }
    .entry-title {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 40px;
      font-weight: 600;
      line-height: 48px;
    }
    .entry-title a { color: inherit; font: inherit; }
    .entry-title a.is-link::after {
      content: "↗";
      margin-left: 0.2em;
      font-size: 0.72em;
      font-weight: 600;
      line-height: 1;
    }
    .entry-subtitle {
      margin: 0 0 14px;
      color: var(--text-2);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.5;
    }
    .entry-body p { margin: 12px 0; }
    .entry-date {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--text-2);
    }

    /* 博客台账表（方案 B）：vp-doc 表格气质 */
    .weekly table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 15px; }
    .weekly th, .weekly td {
      border-bottom: 1px solid var(--divider);
      padding: 12px 10px;
      text-align: left;
      font-weight: 400;
    }
    .weekly th { color: var(--text-2); font-size: 13px; font-weight: 600; }
    .weekly .money { font-variant-numeric: tabular-nums; }

    /* ---------- 窄屏 ---------- */
    @media (max-width: 880px) {
      .app { padding: 22px 16px 56px; }
      .top { flex-direction: column; align-items: flex-start; gap: 6px; }
      .status { text-align: left; }
      .layout { display: block; }
      .entries { margin-bottom: 20px; }
      .editor { padding: 18px; }
      .media-grid { grid-template-columns: 1fr; }
      .row { flex-direction: column; gap: 0; }
      .blog-layout { grid-template-columns: 1fr; }
      .blog-sidebar { border-right: 0; border-bottom: 1px solid var(--divider); }
      .weekly { padding: 24px 18px 32px; }
      .weekly h1, .entry-title { font-size: 34px; line-height: 42px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">误君在脑海里放烟花 · PROTOTYPE</p>
        <h1>AI 开支记录与优化</h1>
      </div>
      <p class="status">低保真草图 · 不连真实数据 · 不执行发布</p>
    </header>

    <nav class="chips" aria-label="查看区域">
      <button class="chip active" data-view="panel">发布面板草图</button>
      <button class="chip" data-view="blog">博客页面草图</button>
    </nav>

    <nav class="chips" aria-label="方案切换">
      <span class="chips-label">方案</span>
      <button class="chip active" data-variant="A">A · 篇章条目</button>
      <button class="chip" data-variant="B">B · 台账</button>
      <button class="chip" data-variant="C">C · 时间线</button>
      <span class="variant-desc" id="variant-desc"></span>
    </nav>

    <section class="view" id="panel-view"></section>
    <section class="view" id="blog-view" hidden></section>
  </div>

  <script>
    const variants = {
      A: '把篇章当作一系列长期条目：每个服务一条，副标题写「金额 · 状态」，正文记录用途、判断与带日期的变化。',
      B: '先管理数字再补充判断。需要独立结构化数据源与专用组件，不在第一版。',
      C: '每次订阅变化追加一条时间记录。适合作为 A 正文里的「变化记录」写法。'
    };

    /* ---------- 共用片段：面板 ---------- */

    function kindsChips() {
      return `<nav class="kinds">
        <button class="chip" data-kind="invest">投资周记</button>
        <button class="chip" data-kind="life">AI与生活周记</button>
        <button class="chip active" data-kind="journey">我的AI历程</button>
      </nav>`;
    }

    function issueBar(hint) {
      return `<section class="issue-bar">
        <h2>AI 开支记录与优化</h2>
        <p class="issue-meta">我的AI历程 · 篇章 · 4 条 · 最后更新 2026-08-18</p>
        <p class="write-hint">${hint}</p>
        <select class="issue-select" aria-label="选择篇章">
          <option>基础设施篇</option>
          <option>工具篇</option>
          <option selected>AI 开支记录与优化</option>
        </select>
      </section>`;
    }

    function entriesAside(active = 'GPT Pro') {
      const items = [
        ['GPT Pro', '约 ¥1,430/月 · 保留'],
        ['Cursor Ultra', '赠送期 · 原价约 ¥1,430/月'],
        ['Grok Heavy', '年付折算约 ¥620/月 · 待评估'],
        ['OpenCode', '约 ¥49/月 · 观察']
      ];
      const rows = items.map(([name, meta]) => `
        <div class="entry-row">

        ? `<a class="is-link" href="${link}">${title}</a>` : `<a>${title}</a>`;

        <h2 class="entry-title">${titleHtml}</h2>
        ${subtitle ? `<p class="entry-subtitle">${subtitle}</p>` : ''}
        <div class="entry-body">${body}</div>

    }

    /* ---------- 博客方案 ---------- */

    function blogA() {
      return `<div class="blog-layout">${blogSidebar()}

    function blogB() {

      <article class="weekly">${blogHead}
        ${entry({
          title: '当前订阅',
          body: `<table>
            <thead><tr><th>服务</th><th>用途</th><th>实际成本</th><th>原价</th><th>状态</th></tr></thead>
            <tbody>
              <tr><td>GPT Pro</td><td>规划、审核、复杂执行</td><td class="money">¥1,430/月</td><td class="money">¥1,430</td><td>保留</td></tr>

        <blockquote><p>口径说明：年付套餐按月折算；赠送额度同时记录实际成本和原价价值。表格由结构化数据生成，需要独立数据源支撑，不在第一版。</p></blockquote>

    }

    function blogC() {
      return `<div class="blog-layout">${blogSidebar()}

          tags: ['开支', '优化'],

          tags: ['开支', '赠送'],

        })}

          tags: ['开支', '年付'],

          subtitle: '2026-08-01 · 折算约 ¥620/月',
          body: `<p>当前保留模型、Bot、视频与 Cursor 权益，福利结束后复核投入产出。</p>`

        <blockquote><p>当前结论：最值得长期保留的是高频主力工具；短期赠送和低价套餐必须设置明确的到期复核日。</p></blockquote>
      </article></div>`;
    }

    /* ---------- 切换逻辑 ---------- */

    const panels = { A: panelA, B: panelB, C: panelC };
    const blogs = { A: blogA, B: blogB, C: blogC };
    const params = new URLSearchParams(location.search);
    let current = params.get('variant') || 'A';
    if (!panels[current]) current = 'A';
    let view = params.get('view') === 'blog' ? 'blog' : 'panel';

    function render() {
      document.querySelector('#panel-view').innerHTML = panels[current]();
      document.querySelector('#blog-view').innerHTML = blogs[current]();
      document.querySelector('#variant-desc').textContent = variants[current];
      document.querySelectorAll('[data-variant]').forEach(btn =>
        btn.classList.toggle('active', btn.dataset.variant === current));
      document.querySelectorAll('[data-view]').forEach(item =>
        item.classList.toggle('active', item.dataset.view === view));
      document.querySelector('#panel-view').hidden = view !== 'panel';
      document.querySelector('#blog-view').hidden = view !== 'blog';
      const url = new URL(location.href);
      url.searchParams.set('variant', current);
      url.searchParams.set('view', view);
      history.replaceState(null, '', url);
    }

    document.querySelectorAll('[data-variant]').forEach(btn =>
      btn.addEventListener('click', () => { current = btn.dataset.variant; render(); }));

    document.querySelectorAll('[data-view]').forEach(btn =>
      btn.addEventListener('click', () => { view = btn.dataset.view; render(); }));

    render();
  </script>
