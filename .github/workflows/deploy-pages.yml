# Push main → build VitePress → Cloudflare Pages (wrangler)
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  — cxks-agent-ops (or equivalent Pages+DNS token)
#   CLOUDFLARE_ACCOUNT_ID — 4b4fb1b1a6a89a919d58bfbbf913fd3d

name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version comes from package.json packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Panel tests
        run: pnpm test:panel

      - name: Production build
        run: pnpm run docs:build

      - name: Write public build metadata
        run: node scripts/write-build-metadata.mjs

      - name: Check build metadata contract
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('docs/.vitepress/dist/build.json','utf8')); if(!m.sha||!m.builtAt||Object.keys(m).sort().join(',')!=='builtAt,sha') process.exit(1)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "3.114.0"
          command: pages deploy docs/.vitepress/dist --project-name=personal-blog --branch=main
